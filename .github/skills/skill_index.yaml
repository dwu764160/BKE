skills:
- name: audit-aggregate
  path: .github/skills/audit-aggregate/SKILL.md
  description: 'Audit suite for profile aggregation (`src/profile_aggregate/`). Ensures
    all

    player-related stats are normalized and merged into the `player_profile_aggregate`.

    '
  tags: &id001
  - audit
  - aggregate
  - profile
  triggers: *id001
  preferred_tools:
  - read_file
  - grep_search
  - semantic_search
  - file_search
  - run_in_terminal
  - get_errors
  avoid_tools:
  - create_new_workspace
  job_scope:
  - Run `src/profile_aggregate/build_profile_aggregate.py` in smoke mode and validate
    output schema.
  - Check that new fields from compute/modeling stages appear in the aggregate.
  - Validate counts (expected 1971 player-season rows) and column normalization rules.
  when_to_use:
  - On-demand, after changes to player-profile sources or when requested by the user.
  log_usage: true
  usage_log: loop/skill_usage.log
- name: audit-compute
  path: .github/skills/audit-compute/SKILL.md
  description: 'Audit suite for the compute stage and pipeline formula integrity.
    Detects

    silent logic bugs in normalization, aggregation, denominator usage, and

    formula correctness. Focuses on `src/data_compute/`, `src/features/`, and

    any scripts that aggregate or normalize data.

    '
  tags:
  - audit
  - compute
  - metrics
  triggers:
  - audit compute
  - compute audit
  - normalization
  - aggregation
  - formula
  - archetype
  preferred_tools:
  - read_file
  - grep_search
  - semantic_search
  - file_search
  - run_in_terminal
  - get_errors
  avoid_tools:
  - create_new_workspace
  job_scope:
  - Run formula and merge integrity checks across `src/data_compute/`.
  - Detect silent logic bugs in normalization, aggregation, and denominator usage.
  - Validate that all merges and joins are correct and do not introduce data leakage
    or row duplication.
  - Ensure all formulas (especially for metrics, normalization, and derived fields)
    are mathematically sound and match project conventions.
  - Validate that archetype gating logic and centralized thresholds are present and
    documented.
  - Run `tests/validate_rapm.py` and any compute-specific validation scripts.
  when_to_use:
  - After any change to metric, normalization, or aggregation logic.
  - Before major releases or after merging large PRs.
  - When silent bugs or unexplained output anomalies are suspected.
  log_usage: true
  usage_log: loop/skill_usage.log
- name: audit-fetch
  path: .github/skills/audit-fetch/SKILL.md
