  description: 'Runs at the end of an interactive session to evaluate which skills
    were used,

    collect simple evaluation signals (user feedback, test / lint results, runtime

    exit codes), and apply minimal, well-scoped updates to skill files to record

    what was learned. Designed to keep skills current and reduce repeated mistakes.

    '
  tags: &id008
  - meta
  - self-improvement
  triggers: *id008
  preferred_tools:
  - read_file
  - grep_search
  - semantic_search
  - file_search
  - get_errors
  - apply_patch
  - run_in_terminal
  avoid_tools:
  - create_new_workspace
  - create_and_run_task
  job_scope:
  - Detect which skills were invoked during the session or which skill files were
    edited.
  - 'Collect evaluation signals: explicit user feedback, `get_errors` output, test
    results, and command exit codes where available.'
  - Summarize learnings into a short markdown note and append it to `loop/self_improvement_log.md`.
  - 'Apply minimal, focused edits to skill files used in the session: add a `## Learnings`
    section or append concise bullet(s) into the skill file.'
  - If recurring gaps are found, propose (and optionally scaffold) new skills per
    the skills-first workflow, but do not modify pipeline source code without explicit
    user approval.
  when_to_use:
  - At the end of every interactive session (explicit `run self-improvement`), or
    when requested by the user.
