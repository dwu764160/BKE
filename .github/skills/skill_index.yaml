- name: self-improvement
  path: .github/skills/self-improvement/SKILL.md
  description: 'Runs at the end of an interactive session to evaluate which skills
    were used,

    collect simple evaluation signals (user feedback, test / lint results, runtime

    exit codes), and apply minimal, well-scoped updates to skill files to record

    what was learned. Designed to keep skills current and reduce repeated mistakes.

    '
  tags: &id010
  - meta
  - self-improvement
  triggers: *id010
  preferred_tools:
  - read_file
  - grep_search
  - semantic_search
  - file_search
  - get_errors
  - apply_patch
  - run_in_terminal
  avoid_tools:
  - create_new_workspace
  - create_and_run_task
  job_scope:
  - Detect which skills were invoked during the session or which skill files were
    edited.
  - 'Collect evaluation signals: explicit user feedback, `get_errors` output, test
    results, and command exit codes where available.'
  - Summarize learnings into a short markdown note and append it to `loop/self_improvement_log.md`.
  - 'Apply minimal, focused edits to skill files used in the session: add a `## Learnings`
    section or append concise bullet(s) into the skill file.'
  - If recurring gaps are found, propose (and optionally scaffold) new skills per
    the skills-first workflow, but do not modify pipeline source code without explicit
    user approval.
  when_to_use:
  - At the end of every interactive session (explicit `run self-improvement`), or
    when requested by the user.
  log_usage: true
  usage_log: loop/skill_usage.log
- name: simulation
  path: .github/skills/simulation/SKILL.md
  description: 'Operations and audit skill for the simulation pipeline. Combines schedule

    generation, game-model execution, and validation/report integrity checks.

    Use this skill to run simulations, validate schedule balance, and audit

    Step1/Step2 outputs and constraints.

    '
  tags: &id011
  - simulation
  - audit
  - schedule
  triggers: *id011
  preferred_tools:
  - read_file
  - grep_search
  - semantic_search
  - file_search
  - run_in_terminal
  - get_errors
  avoid_tools:
  - create_new_workspace
  - create_and_run_task
  job_scope:
  - Run and validate all simulation and schedule scripts (`src/simulation/`).
  - Audit game model logic and ensure schedule integrity (balanced home/away, per-team
    totals).
  - Check simulation report outputs for consistency, completeness, and expected metrics.
  - Run `src/simulation/validate_sim.py` and `src/simulation/season_sim.py` in smoke/validation
    mode.
  - Validate that Step2 lineup projection constraints (position bands, minutes eligibility,
    true-big requirement) are enforced.
  when_to_use:
  - After changes to simulation, schedule, or report logic.
  - Before major simulation runs or after merging game model PRs.
  log_usage: true
  usage_log: loop/skill_usage.log
- name: skill-curator
  path: .github/skills/skill-curator/SKILL.md
  description: 'Curates the repository''s skills: detects duplicates/overlap, runs

    validations, proposes merges, and maintains frontmatter and example

    prompts. Acts as the human-approved gate for skill consolidation.

    '
  tags: &id012
  - skill
  - curation
  - maintenance
  triggers: *id012
  preferred_tools:
  - read_file
  - file_search
  - grep_search
  - semantic_search
  - get_errors
  - run_in_terminal
  - apply_patch
  avoid_tools:
  - create_new_workspace
  - create_and_run_task
  job_scope:
  - Run `scripts/validate_skills.py` and surface missing or inconsistent frontmatter.
  - Detect overlapping skills via semantic search + grep; propose merges and produce
    suggested patches.
  - Run `/.github/skills/self_improvement.skill.md` flow to gather session learnings
    and apply small edits to skill files when safe.
  - Prepare a short delta report (suggested merges, renames, added tags) and request
    user approval before applying non-trivial patches.
  when_to_use:
  - Periodically (weekly) or when many new skills are added/edited.
  - Before a skills-first automation rollout or CI integration.
  log_usage: true
  usage_log: loop/skill_usage.log
