  - Run minute-model training checks and cross-validate `minute_model_v2.pkl` behavior.
  - Validate profile aggregate ingestion (profile_aggregate/build_profile_aggregate.py).
  when_to_use:
  - On-demand, after player-eval logic changes or when requested by the user.
  log_usage: true
  usage_log: loop/skill_usage.log
- name: audit-fetch
  path: .github/skills/audit-fetch/SKILL.md
  description: 'Audit suite for the fetch/ingest stage. Validates fetch scripts, cached

    headers/sessions, payload-shape robustness, and presence of required raw

    artifacts in `data/historical/`.

    '
  tags: &id003
  - audit
  - fetch
  - ingest
  triggers: *id003
  preferred_tools:
  - read_file
  - grep_search
  - semantic_search
  - file_search
  - run_in_terminal
  - get_errors
  avoid_tools:
  - create_new_workspace
  job_scope:
  - Validate fetch scripts in `src/data_fetch/` for payload-shape guards (resultSets/resultSet)
    and robust parsing.
  - Check `data/nba_headers.json` and `data/nba_session.json` presence and freshness.
  - Run smoke fetches where safe and compare output schemas to expected shapes.
  - Run `tests/validate_data_integrity.py` or fetch-stage-specific checks when available.
  when_to_use:
  - On-demand, only when the user requests a fetch-stage audit or after major ingest
    changes.
  log_usage: true
  usage_log: loop/skill_usage.log
- name: pipeline-integrity
  path: .github/skills/pipeline-integrity/SKILL.md
  description: 'Post-fetch pipeline integrity gate. After any data fetch or update,
    verify downstream artifacts are consistent, documentation matches actual data
    state, and the correct re-run chain is queued or confirmed complete.'
  tags:
  - fetch
  - pipeline
  - integrity
  - data-quality
  - downstream
  triggers:
  - fetch
  - pipeline
  - integrity
  - data-quality
  - downstream
  preferred_tools:
  - run_in_terminal
  - read_file
  - grep_search
  - file_search
  - get_errors
  avoid_tools:
  - create_new_workspace
  job_scope:
  - Run artifact completeness check (tracking file counts, box score rows, PBP game counts, aggregate seasons + null rates).
  - Identify minimal re-run chain from decision table based on what data changed.
  - Sync docs/reference/tracking_availability.md and loop/in_progress_context.txt to reflect actual data state.
  - Re-run CLV if box scores or forecasts updated; compare to prior baseline.
  when_to_use:
  - After any fetch script runs (box scores, tracking, PBP, DARKO, salaries, Kalshi).
  - After backfill scripts complete.
  - After model_config.py SEASONS list changes.
  - Any time the user says update data, re-fetch, backfill, or refresh.
  log_usage: true
  usage_log: loop/skill_usage.log
- name: audit-model
  path: .github/skills/audit-model/SKILL.md
  description: 'Audit suite for modeling and impact estimation (`src/modeling/`).
    Runs

    model diagnostics, backtests, and checks for reproducibility and input

    sanity (modeling_inputs_* files and reports).

    '
  tags: &id004
  - audit
  - modeling
  - backtest
  triggers: *id004
  preferred_tools:
  - read_file
  - grep_search
  - semantic_search
  - file_search
  - run_in_terminal
  - get_errors
  avoid_tools:
  - create_new_workspace
  job_scope:
  - Run model diagnostic scripts (e.g., `src/modeling/model_rapm.py`) in smoke mode.
  - Validate `modeling_inputs_{season}.parquet` shapes and distributions against `reports/modeling_inputs_report.json`.
  - Run backtest harnesses and summarize core diagnostics (correlations, MAE/RMSE).
  when_to_use:
  - On-demand, after modeling changes or when requested by the user.
  log_usage: true
  usage_log: loop/skill_usage.log
- name: backtest-vs-forecast
  path: .github/skills/backtest-vs-forecast/SKILL.md
  description: 'Ensures that every simulation or prediction phase has both a backtest
    and a

    forecast component where appropriate. Validates presence of backtest reports

    and forecast artifacts and highlights missing coverage.

    '
  tags: &id005
  - forecast
  - backtest
  - governance
  triggers: *id005
  preferred_tools:
  - read_file
  - grep_search
  - semantic_search
  - run_in_terminal
  - get_errors
  avoid_tools:
  - create_new_workspace
  job_scope:
  - Scan `src/` and `reports/` to find simulation/prediction steps and check for both
    backtest and forecast outputs.
  - Run `src/simulation/run_forecast.py --skip-lineup` in smoke mode when safe (user
    approval required for long runs).
  - Validate that forecast artifacts live under `data/processed/forecast/` and that
    corresponding backtest `reports/` exist.
  - Summarize gaps and propose a remediation checklist (e.g., add forecast runner
    or backtest harness).
  when_to_use:
  - On-demand, when preparing forecasts or validating that modeling changes have both
    backtest and forecast coverage.
  log_usage: true
  usage_log: loop/skill_usage.log
