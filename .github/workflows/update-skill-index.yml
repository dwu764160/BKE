name: Update Skill Index

on:
  push:
    paths:
      - '.github/skills/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: python -m pip install --upgrade pip && pip install PyYAML

      - name: Build skill index
        run: python .github/skills/build_skill_index.py --out .github/skills/skill_index.yaml

      - name: Commit skill index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/skills/skill_index.yaml
          git commit -m "chore: update skill_index.yaml" || echo "no changes"
          git push || echo "push failed"
